<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
<title id="title">Pufibara Lab evidence-driven research workflow</title><desc id="desc">One research goal leads to planning, isolated experiments, analysis, and a result-driven follow-up. Deterministic OpenModelica tools apply fixed evaluation and save evidence. This diagram explains architecture; actual execution is documented separately.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs>
<rect width="1120" height="340" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
<text x="560" y="36" font-size="22" font-weight="bold" fill="#0f172a">One goal → an auditable scientific loop</text>
<rect x="20" y="76" width="200" height="86" rx="12" fill="#e0e7ff" stroke="#6366f1"/><text x="120" y="111" font-size="17" font-weight="bold" fill="#1e1b4b">Research goal</text><text x="120" y="140" font-size="14" fill="#475569">Human input</text>
<path d="M220 119 H238" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="240" y="76" width="200" height="86" rx="12" fill="#e0e7ff" stroke="#6366f1"/><text x="340" y="111" font-size="17" font-weight="bold" fill="#1e1b4b">Hypothesis + plan</text><text x="340" y="140" font-size="14" fill="#475569">Planner</text>
<path d="M440 119 H458" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="460" y="76" width="200" height="86" rx="12" fill="#e0e7ff" stroke="#6366f1"/><text x="560" y="111" font-size="17" font-weight="bold" fill="#1e1b4b">Matched trials</text><text x="560" y="140" font-size="14" fill="#475569">Executor + Modelers</text>
<path d="M660 119 H678" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="76" width="200" height="86" rx="12" fill="#e0e7ff" stroke="#6366f1"/><text x="780" y="111" font-size="17" font-weight="bold" fill="#1e1b4b">Evidence analysis</text><text x="780" y="140" font-size="14" fill="#475569">Analyst</text>
<path d="M880 119 H898" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="900" y="76" width="200" height="86" rx="12" fill="#e0e7ff" stroke="#6366f1"/><text x="1000" y="111" font-size="17" font-weight="bold" fill="#1e1b4b">Follow-up validation</text><text x="1000" y="140" font-size="14" fill="#475569">Executor + Analyst</text>
<path d="M1000 170 V194 H340 V170" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="665" y="219" font-size="14" fill="#475569">Actual results determine the next experiment</text>
<rect x="60" y="242" width="1000" height="62" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="560" y="267" font-size="16" font-weight="bold" fill="#0f172a">Trusted broker + OpenModelica: fixed checking · simulation · behavior</text>
<text x="560" y="289" font-size="14" fill="#475569">Save plans, native messages, source models, raw logs, trajectories, verdicts and failures</text>
<text x="560" y="328" font-size="12" fill="#64748b">Architecture illustration — execution evidence is linked in the README</text></g></svg>